name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    # 关键：设置交叉编译的环境变量，目标是 Windows 7 64位
    - name: Build for Windows 7 64-bit
      run: |
        GOOS=windows GOARCH=amd64 go build -v -o myapp.exe ./...
    
    # 可选：测试（测试通常在编译前运行，这里保持原有功能）
    - name: Test
      run: go test -v ./...

    # 新增：上传编译好的 exe 文件，方便下载
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: myapp.exe
